# Deploys every push to the production branch and moves live to it.
#
# Copy to .github/workflows/ in the site's repository. It needs:
# - bunny.config.ts in the project root, with the site's name;
# - the repository secret BUNNYNET_API_KEY, the API key of the bunny.net account;
# - every astro:env secret the site uses, as env on the deploy step.
#
# Pin the actions to a tag or commit of astro-adapter-bunny instead of main.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy per site at a time: a deploy also deletes old releases.
concurrency:
  group: bunny-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.live-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: deploy
        uses: voorhoede/astro-adapter-bunny/actions/deploy@main
        with:
          api-key: ${{ secrets.BUNNYNET_API_KEY }}
        # The site's astro:env secrets, for example:
        # env:
        #   SECRET_MESSAGE: ${{ secrets.SECRET_MESSAGE }}
