# Deploys every pull request to its own branch URL, and removes it when the
# pull request closes. Use it next to deploy-production.yml.
#
# Copy to .github/workflows/ in the site's repository. Besides what
# deploy-production.yml needs, astro.config.mjs reads the URL from SITE, so
# links and the sitemap point at the preview:
#
#   site: process.env.SITE ?? "https://www.example.com",
#
# A pull request from a fork gets no secrets, so it cannot deploy.

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: bunny-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.branch-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The branch's URL exists before its pull zone does, so the build can use it.
      - id: url
        uses: voorhoede/astro-adapter-bunny/actions/url@main
      - run: npm run build
        env:
          SITE: ${{ steps.url.outputs.url }}
      - id: deploy
        uses: voorhoede/astro-adapter-bunny/actions/deploy@main
        with:
          api-key: ${{ secrets.BUNNYNET_API_KEY }}
        # The site's astro:env secrets, for example:
        # env:
        #   SECRET_MESSAGE: ${{ secrets.SECRET_MESSAGE }}

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: voorhoede/astro-adapter-bunny/actions/teardown@main
        with:
          api-key: ${{ secrets.BUNNYNET_API_KEY }}
