name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.12
      - run: npm ci --ignore-scripts
      - run: npm run check
