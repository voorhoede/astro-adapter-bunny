name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run typecheck -w actions
      # GitHub runs an action's dist/index.js as committed, so it has to match its source; a new or changed bundle fails the check.
      - run: npm run build -w actions && test -z "$(git status --porcelain -- actions)"
