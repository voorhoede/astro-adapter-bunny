name: Release

# Stages the package on npm when a version tag is pushed, such as v0.2.0; a maintainer approves it before it is public.
# npm's trusted publishing authenticates this workflow by its file name, so renaming it breaks publishing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # The OIDC token npm exchanges for a publish, instead of a stored token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      # The tag names the version; a tag that does not match package.json would publish something else than it says.
      - name: Check the tag against package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # A version already on npm, such as one published by hand, is not published again; its tag still releases the actions.
      - name: Check whether npm has the version
        id: npm
        run: |
          if npm view "$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')" version --json > /dev/null 2>&1; then
            echo "Already on npm, so this tag only releases the actions."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # Staged publishing needs npm 11.15.0 or later; an older npm that comes with Node is replaced.
      - name: Check the npm version
        run: |
          if [ "$(printf '%s\n' 11.15.0 "$(npm --version)" | sort -V | head -1)" != 11.15.0 ]; then
            npm install --global npm@11
          fi
          npm --version
      # Builds through prepare and stages the version, which is not public until a maintainer approves it with 2FA,
      # on npmjs.com (Staged Packages) or with `npm stage approve`. Trusted publishing adds provenance by itself.
      - if: steps.npm.outputs.published != 'true'
        run: npm stage publish
