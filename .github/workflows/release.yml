name: Release

# Publishes the package to npm when a version tag is pushed, such as v0.1.0.
# npm's trusted publishing authenticates this workflow by its file name, so renaming it breaks publishing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # The OIDC token npm exchanges for a publish, instead of a stored token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      # The tag names the version; a tag that does not match package.json would publish something else than it says.
      - name: Check the tag against package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # A version already on npm, such as one published by hand, is not published again; its tag still releases the actions.
      - name: Check whether npm has the version
        id: npm
        run: |
          if npm view "$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')" version --json > /dev/null 2>&1; then
            echo "Already on npm, so this tag only releases the actions."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # Builds through prepare. Trusted publishing adds provenance by itself.
      - if: steps.npm.outputs.published != 'true'
        run: npm publish
