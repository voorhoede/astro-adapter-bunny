name: astro-adapter-bunny teardown
description: Removes a branch's pull zone and the releases only that branch deployed, such as after a pull request closes.

inputs:
  api-key:
    description: The API key of the bunny.net account.
    required: true
  branch:
    description: The branch. Defaults to the pull request's branch, or the pushed branch.
    default: ${{ github.head_ref || github.ref_name }}
  working-directory:
    description: The project root, with bunny.config.ts and astro-adapter-bunny installed.
    default: .

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUNNYNET_API_KEY: ${{ inputs.api-key }}
        BRANCH: ${{ inputs.branch }}
      run: |
        node --input-type=module -e '
          const { teardown } = await import("astro-adapter-bunny/deploy").catch((error) => {
            if (error.code !== "ERR_MODULE_NOT_FOUND") throw error;
            throw new Error("Install astro-adapter-bunny in the project before this step.");
          });
          console.log(await teardown({ branch: process.env.BRANCH }));
        '
