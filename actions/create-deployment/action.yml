name: Create a GitHub deployment
author: Voorhoede
description: Records a deploy in the repository's Deployments, and marks the branch's earlier ones inactive

inputs:
  environment:
    description: The GitHub environment, such as "Site Production"
    required: true
  release:
    description: The release that was deployed, the deploy action's release output
    required: true
  url:
    description: The URL the deployment links to, such as the deploy action's branch_url
    required: true
  production:
    description: Whether GitHub shows the deployment as production; defaults to whether the branch is the repository's default branch. A second build of that branch, such as a preview, sets false.
    default: ""
  github_token:
    description: Creates the deployment
    default: ${{ github.token }}

runs:
  using: "node24"
  main: "dist/index.js"
